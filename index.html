<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximiliano Arechiga Morales - vCard Digital</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para la tipografía Inter y un fondo oscuro */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #262a36; /* Fondo oscuro solicitado */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Estilo para los botones de acción */
        .action-button {
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        .action-button:hover {
            transform: translateY(-2px);
            /* Sombra más sutil para fondo oscuro */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }
        /* Clase personalizada para el color de acento amarillo */
        .bg-custom-yellow {
            background-color: #ffcc08;
            color: #1f2937; /* Texto oscuro para contraste */
        }
        .hover\:bg-custom-yellow-dark:hover {
            background-color: #e5b807; /* Un tono ligeramente más oscuro para el hover */
        }
        .focus\:ring-custom-yellow-ring:focus {
            box-shadow: 0 0 0 4px rgba(255, 204, 8, 0.5); /* Anillo de enfoque amarillo */
        }
    </style>
</head>
<body>

    <!-- Contenedor Principal de la Tarjeta (Fondo de la tarjeta ligeramente más claro que el body) -->
    <div class="w-full max-w-sm mx-4 bg-slate-800 rounded-xl shadow-2xl overflow-hidden p-6 md:p-8">

        <!-- Sección Superior: Logos y Nombre -->
        <header class="text-center mb-6">
            <!-- Logo Personal (Placeholder para MAX LOGO.png) -->
            <!-- Borde y fondo del placeholder ajustados a colores oscuros/vibrantes -->
            <div class="relative w-24 h-24 mx-auto mb-4 bg-slate-700 rounded-full border-4 border-cyan-500 shadow-inner overflow-hidden">
                <!-- Se asume que la imagen se cargaría aquí. Usamos un placeholder para el ejemplo. -->
                <img src="https://placehold.co/96x96/0891B2/FFFFFF?text=MAX" alt="MAX LOGO" class="object-cover w-full h-full" onerror="this.onerror=null;this.src='https://placehold.co/96x96/0891B2/FFFFFF?text=MAX';"/>
            </div>
            
            <!-- Texto principal en blanco para alto contraste -->
            <h1 class="text-2xl font-extrabold text-white leading-tight">Maximiliano Arechiga Morales</h1>
            <!-- Título en cyan para mantener el acento -->
            <p class="text-md font-semibold text-cyan-500 uppercase tracking-wider mt-1">Legal</p>

            <!-- Marcas de la Empresa -->
            <!-- Separador más oscuro y texto en gris claro -->
            <div class="flex justify-center items-center space-x-4 mt-3 pt-3 border-t border-slate-700">
                <span class="text-sm font-medium text-gray-300">CounselFid</span>
                <!-- Logo de DOXUS (Placeholder) -->
                <img src="https://placehold.co/100x30/1E293B/FFFFFF?text=DOXUS" alt="DOXUS LOGO" class="h-6" onerror="this.onerror=null;this.src='https://placehold.co/100x30/1E293B/FFFFFF?text=DOXUS';"/>
            </div>
        </header>

        <!-- Sección de Botones de Contacto (Action-Oriented) -->
        <main class="space-y-4">
            <!-- Botón de Teléfono (Cyan principal) -->
            <a href="tel:+523321329326" class="action-button flex items-center justify-center p-3 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 focus:outline-none focus:ring-4 focus:ring-cyan-500 focus:ring-opacity-50">
                <!-- Icono de Teléfono SVG -->
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.717 21 3 14.283 3 6V5z"></path></svg>
                <span class="font-bold">Llamar: +52 3321329326</span>
            </a>

            <!-- Botón de Correo Electrónico (Invertido, resalta el acento Cyan) -->
            <!-- Fondo oscuro, borde y texto en cyan para contraste en la tarjeta oscura -->
            <a href="mailto:m.arechiga@counselfid.mx" class="action-button flex items-center justify-center p-3 bg-slate-900 text-cyan-400 border border-cyan-400 rounded-lg hover:bg-slate-700 focus:outline-none focus:ring-4 focus:ring-cyan-400 focus:ring-opacity-50">
                <!-- Icono de Correo SVG -->
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-19 4v7a2 2 0 002 2h16a2 2 0 002-2v-7"></path></svg>
                <span class="font-bold">Email: m.arechiga@counselfid.mx</span>
            </a>

            <!-- Botón de LinkedIn (Gris oscuro/Slate) -->
            <a href="https://www.linkedin.com/in/maximiliano-aréchiga-morales-6b2431241/" target="_blank" class="action-button flex items-center justify-center p-3 bg-slate-700 text-white rounded-lg hover:bg-slate-600 focus:outline-none focus:ring-4 focus:ring-slate-700 focus:ring-opacity-50">
                <!-- Icono de LinkedIn SVG -->
                <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.528-4 0v5.604h-3v-11h3v1.765c1.395-2.535 7-2.358 7 3.551v5.684z"/></svg>
                <span class="font-bold">Ver Perfil de LinkedIn</span>
            </a>
            
            <!-- Botón para guardar contacto (VCard - Amarillo #ffcc08) -->
            <!-- Se utiliza la clase personalizada para el color del fondo y el hover -->
            <button id="vcard-button" class="action-button w-full flex items-center justify-center p-3 bg-custom-yellow text-slate-800 rounded-lg hover:bg-custom-yellow-dark focus:outline-none focus:ring-4 focus:ring-custom-yellow-ring">
                <!-- Icono de Guardar SVG -->
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                <span class="font-bold">Guardar Contacto (vCard)</span>
            </button>
        </main>
        
        <!-- Código QR -->
        <footer class="mt-8 pt-4 border-t border-slate-700 text-center">
             <p class="text-sm font-medium text-gray-400 mb-3">Escanea para guardar mi información al instante:</p>
             <!-- Placeholder para QR -->
             <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=BEGIN%3AVCARD%0AVERSION%3A3.0%0AN%3AMorales%3BMaximiliano%20Arechiga%0AFN%3AMaximiliano%20Arechiga%20Morales%0ATITLE%3ALegal%0AORG%3ACounselFid%20%2F%20DOXUS%0ATEL%3A%2B523321329326%0AEMAIL%3Am.arechiga%40counselfid.mx%0AURL%3Ahttps%3A%2F%2Fwww.linkedin.com%2Fin%2Fmaximiliano-ar%C3%A9chiga-morales-6b2431241%2F%0AEND%3AVCARD" 
                  alt="Código QR de vCard" 
                  class="mx-auto w-32 h-32 rounded-lg border border-slate-700 shadow-md">
        </footer>

    </div>

    <!-- Script para generar el archivo vCard (VCF) al hacer clic en el botón -->
    <script>
        document.getElementById('vcard-button').addEventListener('click', function() {
            // Contenido de la vCard (formato VCF)
            const vCardContent = `BEGIN:VCARD
VERSION:3.0
N:Morales;Maximiliano Arechiga
FN:Maximiliano Arechiga Morales
TITLE:Legal
ORG:CounselFid / DOXUS
TEL:+523321329326
EMAIL:m.arechiga@counselfid.mx
URL:https://www.linkedin.com/in/maximiliano-aréchiga-morales-6b2431241/
END:VCARD`;

            // Crea un Blob (Binary Large Object) con el contenido de la vCard
            const blob = new Blob([vCardContent], { type: 'text/vcard;charset=utf-8' });
            
            // Crea un enlace temporal para la descarga
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Maximiliano_Arechiga.vcf'; // Nombre del archivo

            // Simula un clic para iniciar la descarga
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>

</body>
</html>
