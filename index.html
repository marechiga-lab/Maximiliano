<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximiliano Arechiga Morales - vCard Digital</title>
    <!-- Carga de Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para la tipografía Inter y un fondo claro/neutro */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5; /* Fondo gris muy claro para buen contraste */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Estilo para los botones de acción */
        .action-button {
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        /* Clase personalizada para el color de acento amarillo */
        .bg-custom-yellow {
            background-color: #ffcc08;
            color: #1f2937; /* Texto oscuro para contraste */
        }
        .hover\:bg-custom-yellow-dark:hover {
            background-color: #e5b807;
        }
        .focus\:ring-custom-yellow-ring:focus {
            box-shadow: 0 0 0 4px rgba(255, 204, 8, 0.5);
        }
        /* Nueva clase para el fondo oscuro del logo DOXUS */
        .bg-doxus-box {
            background-color: #262a36;
        }
    </style>
</head>
<body>

    <!-- Contenedor Principal de la Tarjeta (Fondo blanco para contraste con fondo gris) --><div class="w-full max-w-sm mx-4 bg-white rounded-xl shadow-2xl overflow-hidden p-6 md:p-8">

        <!-- Sección Superior: Logos y Nombre --><header class="text-center mb-6">
            
            <!-- Texto principal en negro para alto contraste sobre fondo blanco --><h1 class="text-2xl font-extrabold text-gray-900 leading-tight">Maximiliano Arechiga Morales</h1>
            <!-- Título en cyan para mantener el acento --><p class="text-md font-semibold text-cyan-600 uppercase tracking-wider mt-1 mb-4">Legal</p>

            <!-- Marcas de la Empresa: COUNSELFID como texto y DOXUS en su recuadro --><div class="flex justify-center items-center space-x-4 pt-3 border-t border-gray-200">
                
                <!-- Nombre de Marca: COUNSELFID (como texto) --><span class="text-base font-extrabold text-gray-800 tracking-wider h-6 flex items-center">COUNSELFID</span>
                
                <span class="text-gray-400 text-lg font-light">|</span> <!-- Separador visual --><!-- Recuadro para el Logo de DOXUS --><div class="bg-doxus-box p-1.5 rounded-md flex items-center justify-center h-8"> 
                    <img src="doxus-logo.png" alt="DOXUS LOGO" class="h-full object-contain" 
                         onerror="this.onerror=null;this.src='https://placehold.co/80x24/262a36/FFFFFF?text=DOXUS';" 
                         title="DOXUS Logo"/>
                </div>
            </div>
             <p class="text-xs font-medium text-gray-400 mt-2">Servicios Legales y Consultoría</p>
        </header>

        <!-- Sección de Botones de Contacto (Action-Oriented) --><main class="space-y-4">
            <!-- Botón de Teléfono (Cyan principal - Texto en blanco) --><a href="tel:+523321329326" class="action-button flex items-center justify-center p-3 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 focus:outline-none focus:ring-4 focus:ring-cyan-500 focus:ring-opacity-50">
                <!-- Icono de Teléfono SVG --><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.717 21 3 14.283 3 6V5z"></path></svg>
                <span class="font-bold">Llamar: +52 3321329326</span>
            </a>

            <!-- Botón de Correo Electrónico (Gris claro/Cyan) --><!-- Fondo blanco, borde y texto en cyan para contraste sutil --><a href="mailto:m.arechiga@counselfid.mx" class="action-button flex items-center justify-center p-3 bg-white text-cyan-600 border border-cyan-600 rounded-lg hover:bg-cyan-50 focus:outline-none focus:ring-4 focus:ring-cyan-400 focus:ring-opacity-50">
                <!-- Icono de Correo SVG --><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-19 4v7a2 2 0 002 2h16a2 2 0 002-2v-7"></path></svg>
                <span class="font-bold">Email: m.arechiga@counselfid.mx</span>
            </a>

            <!-- Botón de LinkedIn (Gris claro) --><a href="https://www.linkedin.com/in/maximiliano-aréchiga-morales-6b2431241/" target="_blank" class="action-button flex items-center justify-center p-3 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-4 focus:ring-gray-300 focus:ring-opacity-50">
                <!-- Icono de LinkedIn SVG --><svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.528-4 0v5.604h-3v-11h3v1.765c1.395-2.535 7-2.358 7 3.551v5.684z"/></svg>

            <!-- Botón para guardar contacto (VCard - Amarillo #ffcc08) --><button id="vcard-button" class="action-button w-full flex items-center justify-center p-3 bg-custom-yellow text-slate-800 rounded-lg hover:bg-custom-yellow-dark focus:outline-none focus:ring-4 focus:ring-custom-yellow-ring">
                <!-- Icono de Guardar SVG --><svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>

        </main>
        
        <!-- Código QR --><footer class="mt-8 pt-4 border-t border-gray-200 text-center">
             <p class="text-sm font-medium text-gray-500 mb-3">Escanea para guardar mi información al instante:</p>
             <!-- Placeholder para QR (con tus datos ya codificados) --><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=BEGIN%3AVCARD%0AVERSION%3A3.0%0AN%3AMorales%3BMaximiliano%20Arechiga%0AFN%3AMaximiliano%20Arechiga%20Morales%0ATITLE%3ALegal%0AORG%3ACounselFid%20%2F%20DOXUS%0ATEL%3A%2B523321329326%0AEMAIL%3Am.arechiga%40counselfid.mx%0AURL%3Ahttps%3A%2F%2Fwww.linkedin.com%2Fin%2Fmaximiliano-ar%C3%A9chiga-morales-6b2431241%2F%0AEND%3AVCARD" 
                  alt="Código QR de vCard" 
                  class="mx-auto w-32 h-32 rounded-lg border border-gray-200 shadow-md">
        </footer>

    </div>

    <!-- Script para generar el archivo vCard (VCF) al hacer clic en el botón --><script>
        document.getElementById('vcard-button').addEventListener('click', function() {
            // Contenido de la vCard (formato VCF)
            const vCardContent = `BEGIN:VCARD
VERSION:3.0
N:Morales;Maximiliano Arechiga
FN:Maximiliano Arechiga Morales
TITLE:Legal
ORG:CounselFid / DOXUS
TEL:+523321329326
EMAIL:m.arechiga@counselfid.mx
URL:https://www.linkedin.com/in/maximiliano-aréchiga-morales-6b2431241/
END:VCARD`;

            // Crea un Blob (Binary Large Object) con el contenido de la vCard
            const blob = new Blob([vCardContent], { type: 'text/vcard;charset=utf-8' });
            
            // Crea un enlace temporal para la descarga
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Maximiliano_Arechiga.vcf'; // Nombre del archivo

            // Simula un clic para iniciar la descarga
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>

</body>
</html>
